<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>This is Event Form</legend>

            <!-- <label for="search">Search </label>
            <input type="search" name="" id="search"> -->

            <!-- <label for="url">URL</label>
            <input type="url" id="url" name="url"> -->

            <!-- <label for="age">Age : &nbsp</label>
            <input type="range" id="age" name="age"> -->

            <label for="name">Name</label>
            <input type="text" name="name" id="name" placeholder="Enter Name">

            <br>
            <br>

            <label for="pass">Password</label>
            <input type="password" name="pass" id="pass" placeholder="Enter password">

            <br>
            <br>

            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="Enter e-mail">

            <br>
            <br>

            <label for="telphone">Telphone</label>
            <input type="tel" id="telphone" placeholder="+91 xxx xxxx xxx">

            <br>
            <br>

            <label for="time">Time & Date</label>
            <input type="datetime-local" id="time">

            <br>
            <br>

            <label for="img">Image : &nbsp</label>
            <input type="file" name="img" id="img">

            <br>
            <br>

            <label for="eventName">Even name :</label>
            <input type="text" id="eventName" placeholder="Event name">

            <br>
            <br>

            <label for="startDate">Start Date </label>
            <input type="date" name="startDate" id="startDate">

            <br>
            <br>

            <label for="endDate">End Date </label>
            <input type="date" name="endDate" id="endDate">

            <br>
            <br>

            <label for="allDay">All-dat</label>
            <input type="checkbox" name="allDay" id="allDay">

            <br>
            <br>

            <label for="calendar">Calendar</label>
            <input type="date" name="calendar" id="calendar" placeholder="">

            <br><br>

            <label for="details">Details</label>
            <br>

            <textarea name="details" id="details" cols="30" rows="10"></textarea>

            <br>
            <br>

            <input type="button" name="reset" value="Reset">
            <input type="button" name="reset" value="Save">

            <br>
            <br>

            <label for="font">Font Family &nbsp</label>
            <select name="font" id="font">
                <option value="Arial">Arial</option>
                <option value="Roman">Times New Roman</option>
                <option value="Georgia">Georgia</option>
                <option value="Baskerville">Baskerville</option>
            </select>

            <br>
            <br>

            <label>Font Weight</label>
            <br>
            <input type="radio" name="weight" id="400">
            <label for="400">400</label>
            <input type="radio" name="weight" id="500">
            <label for="500">500</label>

            <br>
            <br>

            <label for="color">Font Color</label>
            <br>
            <input type="color" name="color" id="color">
            <br>
            <br>
            <label for="size">Font size(px)</label>
            <input type="number" id="size" name="size" min="0" max="50">

            <br>
            <br>

            <input type="button" value="Back">
            <input type="button" value="Done">

            <br>
            <br>

            <input type="submit" name="" value="submit">


        </fieldset>

        <fieldset>
            <legend>MEMBER</legend>
            <table border="5">
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>City</th>
                </tr>

                <tr>
                    <td>Hritik</td>
                    <td>20</td>
                    <td>Patna</td>
                </tr>

                <tr>
                    <td>Nikhil</td>
                    <td>20</td>
                    <td>Patna</td>
                </tr>

                <tr>
                    <td>Aditya</td>
                    <td>20</td>
                    <td>Patna</td>
                </tr>

                <tr>
                    <td>Aman</td>
                    <td>20</td>
                    <td>Patna</td>
                </tr>
            </table>
        </fieldset>


    </form>
</body>

</html>
